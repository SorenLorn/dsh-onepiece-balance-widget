<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <clipPath id="dome">
      <path d="M26 62 C26 36 41 20 60 20 C79 20 94 36 94 62 Z"/>
    </clipPath>
    <g id="bones">
      <g transform="rotate(40 60 74)">
        <rect x="4" y="69" width="112" height="9" rx="4.5"/>
        <circle cx="9" cy="65" r="6.5"/><circle cx="9" cy="82" r="6.5"/>
        <circle cx="111" cy="65" r="6.5"/><circle cx="111" cy="82" r="6.5"/>
      </g>
      <g transform="rotate(-40 60 74)">
        <rect x="4" y="69" width="112" height="9" rx="4.5"/>
        <circle cx="9" cy="65" r="6.5"/><circle cx="9" cy="82" r="6.5"/>
        <circle cx="111" cy="65" r="6.5"/><circle cx="111" cy="82" r="6.5"/>
      </g>
    </g>
    <!-- 脸：下缘收圆的盾形 -->
    <path id="face" d="M60 58 C74 58 82 66 82 78 C82 90 72 97 60 97 C48 97 38 90 38 78 C38 66 46 58 60 58 Z"/>
  </defs>

  <!-- 交叉骨（两遍上色，内部无接缝） -->
  <use href="#bones" fill="#1B1B1B" stroke="#1B1B1B" stroke-width="9" stroke-linejoin="round"/>
  <use href="#bones" fill="#FFFFFF"/>

  <!-- 蓝色帽子 -->
  <path d="M26 62 C26 36 41 20 60 20 C79 20 94 36 94 62 Z" fill="#7FC8EC" stroke="#1B1B1B" stroke-width="5" stroke-linejoin="round"/>
  <!-- 帽沿白点 -->
  <g fill="#FFFFFF">
    <circle cx="60" cy="26" r="3"/><circle cx="45" cy="31" r="3"/><circle cx="75" cy="31" r="3"/>
    <circle cx="35" cy="42" r="3"/><circle cx="85" cy="42" r="3"/>
    <circle cx="30" cy="54" r="3"/><circle cx="90" cy="54" r="3"/>
  </g>

  <!-- 帽正面的粉色圆牌 + 白 X -->
  <circle cx="60" cy="44" r="17" fill="#F2A0AE" stroke="#1B1B1B" stroke-width="4"/>
  <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
    <line x1="51" y1="35" x2="69" y2="53"/>
    <line x1="69" y1="35" x2="51" y2="53"/>
  </g>

  <!-- 脸（白）+ 眼 + 牙 -->
  <use href="#face" fill="#1B1B1B" stroke="#1B1B1B" stroke-width="8" stroke-linejoin="round"/>
  <use href="#face" fill="#FFFFFF"/>
  <circle cx="51" cy="81" r="6.2" fill="#1B1B1B"/>
  <circle cx="69" cy="81" r="6.2" fill="#1B1B1B"/>
  <g stroke="#1B1B1B" stroke-width="2.4" fill="none" stroke-linecap="round">
    <line x1="51" y1="90" x2="69" y2="90"/>
    <line x1="51" y1="90" x2="51" y2="96"/>
    <line x1="69" y1="90" x2="69" y2="96"/>
    <line x1="60" y1="90" x2="60" y2="96.5"/>
  </g>

  <!-- 粉色帽檐：最后画，压在脸的上沿，读起来才是"帽舌" -->
  <path d="M21 58 C38 66 82 66 99 58 C99 65 82 70 60 70 C38 70 21 65 21 58 Z"
        fill="#F2A0AE" stroke="#1B1B1B" stroke-width="4.5" stroke-linejoin="round"/>
</svg>